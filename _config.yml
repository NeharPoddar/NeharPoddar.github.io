# Site settings

locale        : "en-US"
title         : "Nehar Poddar"
name          : &name "Nehar Poddar"
description   : &description "Nehar Poddar - PhD researcher in humanoid robotics at IHMC / University of West Florida"
url           : "https://NeharPoddar.github.io"
baseurl       : ""
timezone      : America/Los_Angeles
encoding      : "utf-8"

author:
  name        : "Nehar Poddar"
  email       : "poddar.nehar@gmail.com"
  linkedin    : "neharpoddar"
  github      : "NeharPoddar"
  scholar     : "https://scholar.google.com/citations?user=sEJbLWwAAAAJ&hl=en"
  lab         : "https://robots.ihmc.us/"

# Reading files
include:
  - _pages
  - files
exclude:
  - _archive_unused
  - Gemfile
  - Gemfile.lock
  - README.md
  - CHANGELOG.md
  - CONTRIBUTING.md
  - LICENSE
  - package.json
  - node_modules
  - talkmap.ipynb
  - talkmap.py
  - vendor
keep_files:
  - .git

markdown_ext: "markdown,mkdown,mkdn,mkd,md"
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  syntax_highlighter: rouge

# Defaults: every page in _pages uses the single "page" layout
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page

plugins:
  - jekyll-sitemap

permalink: /:title/
